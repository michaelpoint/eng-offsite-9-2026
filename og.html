<!DOCTYPE html>
<html lang="en">

<!-- Source for og.png (the Slack/link preview card).
     Regenerate after copy changes:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
       --disable-gpu --hide-scrollbars --virtual-time-budget=5000 --window-size=1200,630 \
       --screenshot=og.png "file://$PWD/og.html" -->

<head>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            width: 1200px;
            height: 630px;
            overflow: hidden;
            position: relative;
            background: #FAF7F2;
            font-family: "IBM Plex Sans", system-ui, sans-serif;
            color: #1F2937;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(680px 420px at 84% -6%, rgba(253, 224, 71, .62), transparent 62%),
                radial-gradient(520px 340px at 8% 4%, rgba(251, 146, 60, .2), transparent 60%),
                radial-gradient(700px 420px at 50% 118%, rgba(6, 182, 212, .1), transparent 60%);
        }

        body::after {
            content: "";
            position: absolute;
            inset: 0;
            opacity: .5;
            background-image:
                linear-gradient(to right, rgba(140, 133, 116, .1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(140, 133, 116, .1) 1px, transparent 1px);
            background-size: 90px 90px;
            -webkit-mask-image: radial-gradient(800px 520px at 40% 0%, #000, transparent 76%);
        }

        .inner {
            position: relative;
            z-index: 2;
            padding: 68px 74px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .eyebrow {
            font-family: "IBM Plex Mono", monospace;
            font-size: 17px;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: #55606F;
            display: flex;
            gap: 16px;
            align-items: center;
            margin: 0;
        }

        .eyebrow i {
            font-style: normal;
            color: #D7CCB8
        }

        h1 {
            font-family: Fraunces, Georgia, serif;
            font-weight: 600;
            font-size: 116px;
            line-height: .94;
            letter-spacing: -.026em;
            margin: 30px 0 0;
        }

        h1 em {
            font-style: italic;
            font-weight: 400;
            background: linear-gradient(100deg, #F97316, #A8306A 62%);
            -webkit-background-clip: text;
            color: transparent;
        }

        p.sub {
            font-size: 27px;
            line-height: 1.45;
            color: #55606F;
            margin: 26px 0 0;
            max-width: 25ch;
        }

        .chips {
            margin-top: auto;
            display: flex;
            flex-wrap: nowrap;
            gap: 9px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            background: rgba(255, 255, 255, .8);
            border: 1px solid #E8E0D2;
            border-radius: 99px;
            padding: 9px 15px;
            font-family: "IBM Plex Mono", monospace;
            font-size: 14px;
            letter-spacing: .04em;
            color: #55606F;
        }

        .chip b {
            width: 10px;
            height: 10px;
            border-radius: 50%
        }

        .sun {
            position: absolute;
            top: -120px;
            right: -80px;
            width: 460px;
            height: 460px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(253, 224, 71, .6), rgba(251, 146, 60, .24) 46%, transparent 70%);
            filter: blur(4px);
        }
    </style>
</head>

<body>
    <div class="sun"></div>
    <div class="inner">
        <p class="eyebrow">Point Engineering <i>◆</i> Santa Cruz County <i>◆</i> Wed 30 Sept</p>
        <h1>Pick your <em>afternoon</em>.</h1>
        <p class="sub">Pick one — that's your lunch and dinner crew too.</p>

        <div class="chips">
            <span class="chip"><b style="background:#06B6D4"></b> Hotel Hang</span>
            <span class="chip"><b style="background:#D97706"></b> Beer Thirty</span>
            <span class="chip"><b style="background:#FB923C"></b> Capitola</span>
            <span class="chip"><b style="background:#4D7C0F"></b> Disc Golf</span>
            <span class="chip"><b style="background:#0284C7"></b> Bike Cruise</span>
            <span class="chip"><b style="background:#14532D"></b> Redwood Hike</span>
        </div>
    </div>
</body>

</html>
